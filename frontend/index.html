<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="any">
<meta name="x5-orientation" content="auto">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>随身大师 Web 复刻版</title>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
/* ===== 全局 ===== */
:root{
  --primary:#5B68AA;--primary-dark:#4A5799;--primary-light:#BEC4FF;
  --bg:#FAF8FF;--surface:#FFFFFF;--text:#1A1A1A;--text2:#333;--text3:#666;--text4:#999;
  --border:#E2E0EE;--bubble-user:#5B68AA;--bubble-ai:#F0EDF5;--input-bg:#F5F3FA;
  --gold:#C9A565;--danger:#E53935;--success:#43A047;--warning:#FB8C00;
  --shadow-sm:0 1px 3px rgba(91,104,170,.08);
  --shadow-md:0 2px 8px rgba(91,104,170,.08);
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:999px;
  --transition:all 200ms cubic-bezier(0.4,0,0.2,1);
  --sidebar-bg:#F5F3FA;
}
[data-theme="dark"]{
  --primary:#8B95E0;--primary-dark:#7A84CF;--primary-light:#5B68AA;
  --bg:#1A1A2E;--surface:#16213E;--text:#E0E0E0;--text2:#CCC;--text3:#AAA;--text4:#888;
  --border:#2A2A4A;--bubble-user:#8B95E0;--bubble-ai:#1E2A45;--input-bg:#1E2A45;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 2px 8px rgba(0,0,0,.3);
  --sidebar-bg:#16213E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'HarmonyOS Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;transition:background 300ms,color 300ms}
@font-face{font-family:'HarmonyOS Sans SC';src:url('/static/HarmonyOS_Sans_SC_Regular.ttf');font-weight:400}
@font-face{font-family:'HarmonyOS Sans SC';src:url('/static/HarmonyOS_Sans_SC_Medium.ttf');font-weight:500}
@font-face{font-family:'HarmonyOS Sans SC';src:url('/static/HarmonyOS_Sans_SC_Bold.ttf');font-weight:700}

/* ===== 侧边栏 ===== */
.sidebar{width:280px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:all 300ms;overflow:hidden}
.sidebar.collapsed{width:0;border-right:none;padding:0}
.sidebar-header{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header h2{font-size:16px;font-weight:700;color:var(--text);flex:1}
.sidebar-header .btn-sm{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:var(--transition)}
.sidebar-header .btn-sm:hover{background:rgba(91,104,170,.1);color:var(--primary)}
.new-chat-btn{margin:12px 16px;padding:10px;border-radius:var(--radius-md);border:1px dashed var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:var(--transition);flex-shrink:0}
.new-chat-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(91,104,170,.04)}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px}
.chat-item{padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;transition:var(--transition);margin:2px 0;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px;position:relative;user-select:none}
.chat-item:hover{background:rgba(91,104,170,.06)}
.chat-item.active{background:rgba(91,104,170,.12);color:var(--primary);font-weight:500}
.chat-item .chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-item .chat-del{opacity:0;font-size:14px;cursor:pointer;transition:var(--transition);padding:2px}
.chat-item:hover .chat-del{opacity:0.6}
.chat-item .chat-del:hover{opacity:1;color:var(--danger)}
.chat-item .chat-time{font-size:10px;color:var(--text4);flex-shrink:0}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ===== 顶栏 ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;transition:background 300ms}
.topbar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex:1}
.topbar .btn{width:36px;height:36px;border-radius:var(--radius-md);border:none;background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--text3)}
.topbar .btn:hover{background:rgba(91,104,170,.08);color:var(--text)}
.topbar .status{font-size:11px;color:var(--success);display:flex;align-items:center;gap:4px}
.topbar .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
.topbar .status.offline{color:var(--danger)}
.topbar .status.offline::before{background:var(--danger)}
.sidebar-toggle{display:none}

/* ===== 消息区 ===== */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:85%;animation:msgIn 200ms cubic-bezier(0,0,0.2,1)}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg .avatar{width:32px;height:32px;border-radius:var(--radius-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.msg.user .avatar{background:var(--primary);color:#fff}
.msg.ai .avatar{background:var(--primary-light);color:var(--primary)}
.msg .bubble{padding:10px 16px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.user .bubble{background:var(--bubble-user);color:#fff;border-radius:16px 4px 16px 16px}
.msg.ai .bubble{background:var(--bubble-ai);color:var(--text2);border-radius:4px 16px 16px 16px}
.msg .time{font-size:10px;color:var(--text4);margin-top:4px;text-align:right}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== 系统消息 ===== */
.msg.sys{align-self:center;max-width:90%}
.msg.sys .bubble{background:transparent;color:var(--text4);font-size:11px;text-align:center;padding:4px 12px}

/* ===== 排盘卡片 (DSML 渲染) ===== */
.bazi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin:8px 0;box-shadow:var(--shadow-md);max-width:100%;overflow-x:auto;transition:background 300ms,border-color 300ms}
.bazi-card .card-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary-light)}

/* Tool-call 折叠面板 */
.tool-call-wrapper{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);transition:background 300ms,border-color 300ms}
.tc-header{cursor:pointer;user-select:none;display:flex;align-items:center;padding:8px 12px;font-size:12px;color:var(--text2);background:var(--input-bg);transition:var(--transition)}
.tc-header:hover{background:rgba(91,104,170,.08)}
.bazi-info{font-size:12px;color:var(--text3);margin-bottom:12px;padding:8px;background:var(--input-bg);border-radius:var(--radius-md)}
.pillars-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.pillar{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 8px;text-align:center;background:var(--surface);transition:background 300ms}
.pillar-highlight{border-color:var(--primary);background:rgba(91,104,170,.04)}
[data-theme="dark"] .pillar-highlight{background:rgba(139,149,224,.08)}
.pillar .gan{font-size:20px;font-weight:700;color:var(--text);display:block}
.pillar .zhi{font-size:14px;color:var(--text2);display:block;margin:2px 0}
.pillar .cang-gan{font-size:10px;color:var(--text4);font-style:italic}
.pillar .shi-shen{display:inline-block;padding:1px 8px;border-radius:var(--radius-full);font-size:10px;font-weight:500;margin:2px}
.pillar .kong-wang{font-size:10px;color:var(--danger)}
.pillar .na-yin{font-size:10px;color:var(--primary-dark);margin-top:2px}
.dayun-section{margin:8px 0}
.dayun-section .section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px}
.dayun-item{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;margin:3px;border-radius:var(--radius-md);background:rgba(91,104,170,.06);font-size:11px;min-width:60px}
.dayun-item .dy-gan{font-size:16px;font-weight:700;color:var(--primary)}
.dayun-item .dy-zhi{font-size:12px;color:var(--text2)}
.dayun-item .dy-age{font-size:9px;color:var(--text4)}
.dayun-item .dy-wuxing{font-size:9px;color:var(--gold);margin-top:1px}
.dayun-item .dy-shishen{font-size:9px;color:var(--primary-dark);margin-top:1px}
.dayun-item.dayun-current{border:2px solid var(--primary);background:rgba(91,104,170,.12);box-shadow:0 0 6px rgba(91,104,170,.2)}
.shen-sha-list{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.shen-sha-tag{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:rgba(201,165,101,.15);color:var(--gold)}
.wuxing-stats{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.wuxing-item{flex:1;text-align:center;padding:6px;border-radius:var(--radius-md);font-size:12px;font-weight:600;min-width:40px}
.ming-gong,.shen-gong,.tai-xi,.tai-yuan{padding:6px 10px;background:var(--input-bg);border-radius:var(--radius-md);font-size:12px;margin:2px 4px;display:inline-block}
.geju{padding:8px 12px;background:linear-gradient(135deg,rgba(91,104,170,.06),rgba(201,165,101,.06));border-radius:var(--radius-md);font-size:12px;margin:8px 0;color:var(--text2)}

/* ===== 历史消息渲染（从 localStorage 恢复） ===== */
.hist-msg{padding:8px 0}

/* ===== 输入区 ===== */
.input-area{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:flex-end;gap:10px;flex-shrink:0;transition:background 300ms}
.input-area textarea{flex:1;background:var(--input-bg);border:none;border-radius:20px;padding:10px 16px;font-size:14px;color:var(--text);resize:none;outline:none;line-height:1.4;max-height:120px;font-family:inherit;transition:var(--transition)}
.input-area textarea:focus{box-shadow:0 0 0 2px rgba(91,104,170,.2)}
.input-area textarea::placeholder{color:var(--text4)}
/* ===== 附件按钮 ===== */
.attach-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text4);flex-shrink:0;transition:var(--transition)}
.attach-btn:hover{background:rgba(91,104,170,.08);color:var(--primary)}

.input-area .send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition)}
.input-area .send-btn:hover{background:var(--primary-dark);transform:scale(1.05)}
.input-area .send-btn:disabled{background:#ccc;cursor:not-allowed;transform:none}

/* ===== 打字指示器 ===== */
.typing{display:flex;align-items:center;gap:4px;padding:8px 16px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--primary-light);animation:typingBounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ===== 快捷入口 ===== */
.quick-actions{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap;flex-shrink:0}
.quick-btn{font-size:11px;padding:4px 12px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;transition:var(--transition);white-space:nowrap}
.quick-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(91,104,170,.04)}

/* ===== 错误提示 ===== */
.error-msg{background:#FFF5F5;color:var(--danger);font-size:12px;padding:8px 12px;border-radius:var(--radius-md);border:1px solid #FFCDD2;margin:4px 0}
[data-theme="dark"] .error-msg{background:rgba(229,57,53,.1);border-color:rgba(229,57,53,.2)}

/* ===== Loading ===== */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,46,.7);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:12px}
.loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 800ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay.hidden{display:none}
/* ===== 消息操作按钮 ===== */
.msg-actions{display:flex;gap:4px;margin-top:2px;opacity:0;transition:var(--transition)}
.msg.ai:hover .msg-actions{opacity:1}
.msg-actions .msg-btn{width:24px;height:24px;border-radius:var(--radius-sm);border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--text4);display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.msg-actions .msg-btn:hover{background:rgba(91,104,170,.08);color:var(--primary)}

/* ===== 空状态 ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--text4);text-align:center;padding:32px}
.empty-state .logo-text{font-size:48px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 4px rgba(91,104,170,.15))}
.empty-state .logo-sub{font-size:13px;color:var(--text4);margin-top:-8px}
.empty-state .welcome-title{font-size:16px;font-weight:600;color:var(--text2)}
.empty-state .welcome-desc{font-size:12px;color:var(--text4);max-width:260px;line-height:1.6}
.empty-state .empty-logo-sub{font-size:14px;background:linear-gradient(135deg,#C9A565,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}

/* ===== 侧边栏搜索 ===== */
.sidebar-search{padding:8px 12px;flex-shrink:0}
.sidebar-search input{width:100%;padding:6px 10px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text);outline:none;font-family:inherit;transition:var(--transition)}
.sidebar-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,104,170,.1)}
.sidebar-search input::placeholder{color:var(--text4)}
.sidebar-empty-state{padding:20px;text-align:center;color:var(--text4);font-size:12px}
.empty-state .start-guide{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
/* ===== 骨架屏 ===== */
.skeleton-msg{display:flex;gap:10px;padding:8px 0;animation:shimmer 2s infinite}
.skeleton-avatar{width:32px;height:32px;border-radius:var(--radius-md);background:linear-gradient(90deg,var(--border) 25%,var(--input-bg) 50%,var(--border) 75%);background-size:200% 100%}
.skeleton-bubble{flex:1;max-width:70%;display:flex;flex-direction:column;gap:6px}
.skeleton-line{height:12px;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--border) 25%,var(--input-bg) 50%,var(--border) 75%);background-size:200% 100%}
.skeleton-line.short{width:60%}
.skeleton-line.medium{width:85%}
.skeleton-line.long{width:100%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== 右键菜单 ===== */
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:90;min-width:140px;padding:4px;animation:ctxIn 100ms cubic-bezier(0,0,0.2,1);transition:background 300ms}
@keyframes ctxIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
.ctx-item{padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px;transition:var(--transition);user-select:none}
.ctx-item:hover{background:rgba(91,104,170,.08)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:rgba(229,57,53,.08)}
.ctx-divider{height:1px;background:var(--border);margin:4px 0}

/* ===== 侧边栏空状态 ===== */
.sidebar-empty{padding:24px 16px;text-align:center;color:var(--text4);font-size:12px}
.sidebar-empty .empty-icon{font-size:32px;margin-bottom:8px;opacity:0.4}

/* ===== 排盘卡片展开动画 ===== */
.bazi-card,.liuyao-card,.qimen-card,.liuren-card{animation:cardExpand 350ms cubic-bezier(0,0,0.2,1)}

/* ===== 流式输出光标 ===== */
.stream-cursor{display:inline-block;width:2px;height:1em;background:var(--primary);margin-left:2px;vertical-align:text-bottom;animation:cursorBlink 800ms steps(1) infinite}

/* ===== 通用信息卡片 ===== */
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin:8px 0;box-shadow:var(--shadow-md);transition:background 300ms,border-color 300ms}
.info-card .card-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary-light)}
.info-card .info-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.info-card .info-row:last-child{border-bottom:none}
.info-card .info-label{color:var(--text4);min-width:60px;flex-shrink:0}
.info-card .info-value{color:var(--text2);font-weight:500}
.info-card .info-tag{display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:10px;margin:1px}
.info-card .info-tag.good{background:rgba(67,160,71,.1);color:var(--success)}
.info-card .info-tag.bad{background:rgba(229,57,53,.1);color:var(--danger)}
.info-card .info-tag.warn{background:rgba(251,140,0,.1);color:var(--warning)}
.info-card .score-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:3px solid}
.info-card .score-circle.great{border-color:var(--success);color:var(--success)}
.info-card .score-circle.good{border-color:var(--primary);color:var(--primary)}
.info-card .score-circle.ok{border-color:var(--warning);color:var(--warning)}
.info-card .score-circle.bad{border-color:var(--danger);color:var(--danger)}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ===== 墨水波纹效果 ===== */
.ripple-effect{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rippleAnimate 600ms cubic-bezier(0,0,0.2,1) forwards;pointer-events:none}
[data-theme="dark"] .ripple-effect{background:rgba(255,255,255,.15)}
@keyframes rippleAnimate{to{transform:scale(4);opacity:0}}

/* ===== 重试按钮 ===== */
.retry-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--radius-full);border:1px solid var(--danger);background:transparent;color:var(--danger);cursor:pointer;font-size:11px;transition:var(--transition);margin-top:4px}
.retry-btn:hover{background:rgba(229,57,53,.06)}

/* ===== 紫微斗数 12宫盘 ===== */
.ziwei-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin:8px 0;box-shadow:var(--shadow-md);transition:background 300ms,border-color 300ms}
.ziwei-card .card-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary-light)}
.zw-info{font-size:12px;color:var(--text3);margin-bottom:12px;padding:8px;background:var(--input-bg);border-radius:var(--radius-md);display:flex;flex-wrap:wrap;gap:8px}
.zw-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:4px;max-width:600px;margin:0 auto}
.zw-cell{padding:10px 6px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--input-bg);text-align:center;transition:all 150ms;min-height:80px;display:flex;flex-direction:column}
.zw-cell:hover{background:rgba(91,104,170,.04);border-color:var(--primary-light)}
.zw-cell.life{border:2px solid var(--primary);background:rgba(91,104,170,.04)}

    for (var i = 0; i < types.length; i++) {
        var t = types[i];
        if (t === '_multi' || t === 'error') continue;
        var data = panData[t];
        var summary = summarizePanForCompare(t, data);
        html += '<tr><td><strong>' + t + '</strong></td><td>' + (summary.core || '—') + '</td><td>' + (summary.key || '—') + '</td></tr>';
    }
    html += '</table></div>';
    return html;
}

function summarizePanForCompare(type, data) {
    var summarize = { core: '', key: '' };
    if (type === 'bazi' && data.pillars) {
        var p = data.pillars;
        summarize.core = '日主 ' + (data.ri_gan||'?') + ' | ' + (p.日柱?.干支||'?');

    return summarize;
}

// ===== 墨水波纹效果 =====
function initRippleEffect() {
    document.addEventListener('click', function(e) {
        var target = e.target.closest('button, .quick-btn, .send-btn, .attach-btn, .coin-btn, .divine-opt, .retry-btn');
        if (!target) return;
        createRipple(target, e);
    });
}

function createRipple(el, e) {
    var rect = el.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    var size = Math.max(rect.width, rect.height);
    
    var ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    
    // 检查是否已有 overflow hidden，没有则临时添加
    var origOverflow = el.style.overflow;
    if (!origOverflow || origOverflow === 'visible') {
        el.style.overflow = 'hidden';
    }
    var origPosition = el.style.position;
    if (!origPosition || origPosition === 'static') {
        el.style.position = 'relative';
    }
    
    el.appendChild(ripple);
    
    ripple.addEventListener('animationend', function() {
        ripple.remove();
        if (!origOverflow || origOverflow === 'visible') {
            el.style.overflow = origOverflow;
        }
        if (!origPosition || origPosition === 'static') {
            el.style.position = origPosition;
        }
    });
}

// ===== Markdown + DSML 渲染 =====
function renderContent(text, panData) {
    if (!text) return '';
    if (text.includes('<命盘>') || text.includes('<四柱>')) return renderDSML(text, panData);
    return simpleRender(text);
}

// ===== DSML 渲染 =====
function renderDSML(text, panData) {
    const cardMatch = text.match(/<命盘[^>]*>([\s\S]*?)<\/命盘>/);

    // 检测 type 属性
    const typeMatch = text.match(/<命盘[^>]*type="([^"]+)"/);
    if (typeMatch && panData) {
        const dtype = typeMatch[1];
        let directHtml = '';
        if (dtype === 'ziwei') directHtml = renderZiwei(panData);
        else if (dtype === 'liuren') directHtml = renderLiuren(panData);
        else if (dtype === 'qimen') directHtml = renderQimen(panData);
        else if (dtype === 'liuyao') directHtml = renderLiuyao(panData);
        if (directHtml) {
            let before = text, after = '';
            if (cardMatch) { before = text.substring(0, cardMatch.index); after = text.substring(cardMatch.index + cardMatch[0].length); }
            let result = '';
            if (before.trim()) result += simpleRender(before.trim()) + '<br>';
            result += directHtml;
            if (after.trim()) result += '<br>' + simpleRender(after.trim());
            return result;
        }
    }

    let cardHtml = '';
    if (cardMatch) {
        const inner = cardMatch[1];
        cardHtml = '<div class="bazi-card">';
        cardHtml += '<div class="card-title">📊 排盘结果</div>';
        const info = inner.match(/<基本信息[^>]*>([\s\S]*?)<\/基本信息>/);
        if (info) cardHtml += `<div class="bazi-info">${parseFields(info[1])}</div>`;
        const sizhu = inner.match(/<四柱[^>]*>([\s\S]*?)<\/四柱>/);
        if (sizhu) cardHtml += renderPillars(sizhu[1]);
        const nayin = inner.match(/<纳音[^>]*>(.*?)<\/纳音>/);
        if (nayin) cardHtml += `<div style="font-size:12px;color:var(--primary-dark);margin:6px 0">🔔 纳音: ${nayin[1].trim()}</div>`;
        const shensha = inner.match(/<神煞[^>]*>([\s\S]*?)<\/神煞>/);
        if (shensha) cardHtml += renderShensha(shensha[1]);
        // 计算当前年龄用于大运高亮
        let currentAge = 0;
        if (panData && panData.current_age) {
            currentAge = panData.current_age;
        }
        const dayun = inner.match(/<大运[^>]*>([\s\S]*?)<\/大运>/);
        if (dayun) cardHtml += renderDayun(dayun[1], currentAge);
        const liunian = inner.match(/<流年[^>]*>([\s\S]*?)<\/流年>/);
        if (liunian) cardHtml += renderLiunian(liunian[1]);
        for (const tag of ['命宫','身宫','胎息','胎元']) {
            const m = inner.match(new RegExp(`<${tag}[^>]*>(.*?)<\\/${tag}>`));
            if (m) cardHtml += `<span class="${tag.toLowerCase()}">${tag}: ${m[1].trim()}</span>`;
        }
        const geju = inner.match(/<格局[^>]*>([\s\S]*?)<\/格局>/);
        if (geju) cardHtml += `<div class="geju">📐 格局: ${geju[1].trim()}</div>`;
        const wuxing = inner.match(/<五行统计[^>]*>([\s\S]*?)<\/五行统计>/);
        if (wuxing) cardHtml += renderWuxing(wuxing[1]);
        cardHtml += '</div>';
    }
    let before = text, after = '';
    if (cardMatch) { before = text.substring(0, cardMatch.index); after = text.substring(cardMatch.index + cardMatch[0].length); }
    let result = '';
    if (before.trim()) result += simpleRender(before.trim()) + '<br>';
    result += cardHtml;
    if (after.trim()) result += '<br>' + simpleRender(after.trim());
    return result;
}

function parseFields(text) { return text.replace(/<[^>]+>/g, '').replace(/\n/g, ' '); }

function renderPillars(html) {
    const pillars = ['年柱','月柱','日柱','时柱'];
    let result = '<div class="pillars-grid">';
    for (const p of pillars) {
        const re = new RegExp(`<${p}[^>]*>([\\s\\S]*?)<\\/${p}>`);
        const m = html.match(re);
        if (!m) continue;
        const content = m[1];
        const hl = p === '日柱' ? ' pillar-highlight' : '';
        result += `<div class="pillar${hl}">`;
        result += `<div style="font-size:10px;color:var(--text4);margin-bottom:4px">${p}</div>`;
        const gan = content.match(/<天干[^>]*>(.*?)<\/天干>/);
        if (gan) result += `<span class="gan">${gan[1].trim()}</span>`;
        const zhi = content.match(/<地支[^>]*>(.*?)<\/地支>/);
        if (zhi) result += `<span class="zhi">${zhi[1].trim()}</span>`;
        const cg = content.match(/<藏干[^>]*>(.*?)<\/藏干>/);
        if (cg) result += `<span class="cang-gan">藏:${cg[1].trim()}</span>`;
        const ssRe = /<十神[^>]*>(.*?)<\/十神>/g;
        let ss;
        while ((ss = ssRe.exec(content)) !== null) {
            const val = ss[1].trim();
            const color = SHISHEN_COLORS[val] || '#888';
            result += `<span class="shi-shen" style="background:${color}20;color:${color}">${val}</span>`;
        }
        const kw = content.match(/<空亡[^>]*>(.*?)<\/空亡>/);
        if (kw) result += `<span class="kong-wang">空:${kw[1].trim()}</span>`;
        result += '</div>';
    }
    result += '</div>';
    return result;
}

function renderShensha(html) {
    const tags = html.match(/<[^>]+>([^<]+)<\/[^>]+>/g);
    if (!tags) return '';
    let result = '<div class="shen-sha-list">';
    for (const t of tags) {
        const val = t.replace(/<[^>]+>/g, '');
        if (val.trim()) result += `<span class="shen-sha-tag">${val.trim()}</span>`;
    }
    result += '</div>';
    return result;
}


function renderDayun(html, currentAge) {
    const items = html.match(/<大运干支[^>]*>[\s\S]*?<\/大运干支>/g);
    if (!items) return '';
    let result = '<div class="dayun-section"><div class="section-title">📈 大运</div>';
    let idx = 0;
    for (const item of items) {
        let gan = (item.match(/<天干[^>]*>(.*?)<\/天干>/) || [])[1] || '';
        let zhi = (item.match(/<地支[^>]*>(.*?)<\/地支>/) || [])[1] || '';
        if (!gan && !zhi) {
            const gz = (item.match(/<干支[^>]*>(.*?)<\/干支>/) || [])[1] || '';
            if (gz) { gan = gz[0] || ''; zhi = gz[1] || ''; }
        }
        const ageText = (item.match(/<起运年龄[^>]*>(.*?)<\/起运年龄>/) || [])[1] || '';
        const ageNum = parseInt(ageText) || 0;
        const wuxing = (item.match(/<五行[^>]*>(.*?)<\/五行>/) || [])[1] || '';
        const shishen = (item.match(/<十神[^>]*>(.*?)<\/十神>/) || [])[1] || '';
        // 十年范围
        const rangeEnd = ageNum + 9;
        const ageRange = ageNum ? `${ageNum}-${rangeEnd}岁` : '';
        // 当前大运高亮
        let isCurrent = false;
        if (currentAge > 0 && ageNum > 0) {
            if (currentAge >= ageNum && currentAge <= rangeEnd) isCurrent = true;
        }
        const cls = isCurrent ? ' dayun-current' : '';
        result += `<div class="dayun-item${cls}">`;
        if (gan) result += `<span class="dy-gan">${gan.trim()}</span>`;
        if (zhi) result += `<span class="dy-zhi">${zhi.trim()}</span>`;
        if (wuxing) result += `<span class="dy-wuxing">${wuxing.trim()}</span>`;
        if (shishen) result += `<span class="dy-shishen">${shishen.trim()}</span>`;
        if (ageRange) result += `<span class="dy-age">${ageRange}</span>`;
        result += '</div>';
        idx++;
    }
    result += '</div>';
    return result;
}

function renderLiunian(html) {
    // 解析流年 DSML
    const items = html.match(/<流年干支[^>]*>[\s\S]*?<\/流年干支>/g);
    if (!items) {
        // 向后兼容：无结构数据时显示原始文本
        const text = html.replace(/<[^>]+>/g, '').trim();
        if (text) return `<div class="liunian-section"><div class="section-title">📅 流年</div><div style="font-size:12px;color:var(--text3);padding:4px 8px">${simpleRender(text)}</div></div>`;
        return '';
    }
    let result = '<div class="liunian-section"><div class="section-title">📅 流年</div><div class="dayun-section" style="flex-wrap:wrap">';
    for (const item of items) {
        let gan = (item.match(/<天干[^>]*>(.*?)<\/天干>/) || [])[1] || '';
        let zhi = (item.match(/<地支[^>]*>(.*?)<\/地支>/) || [])[1] || '';
        if (!gan && !zhi) {
            const gz = (item.match(/<干支[^>]*>(.*?)<\/干支>/) || [])[1] || '';
            if (gz) { gan = gz[0] || ''; zhi = gz[1] || ''; }
        }
        const year = (item.match(/<年份[^>]*>(.*?)<\/年份>/) || [])[1] || '';
        const wuxing = (item.match(/<五行[^>]*>(.*?)<\/五行>/) || [])[1] || '';
        const shishenDayun = (item.match(/<关系[^>]*>(.*?)<\/关系>/) || [])[1] || '';
        const shishenRiyuan = (item.match(/<日主十神[^>]*>(.*?)<\/日主十神>/) || [])[1] || '';
        result += '<div class="dayun-item">';
        if (gan) result += `<span class="dy-gan">${gan.trim()}</span>`;
        if (zhi) result += `<span class="dy-zhi">${zhi.trim()}</span>`;
        if (wuxing) result += `<span class="dy-wuxing">${wuxing.trim()}</span>`;
        if (shishenDayun) result += `<span class="dy-shishen">${shishenDayun.trim()}</span>`;
        if (shishenRiyuan) result += `<span style="font-size:9px;color:var(--text4)">日:${shishenRiyuan.trim()}</span>`;
        if (year) result += `<span class="dy-age">${year.trim()}</span>`;
        result += '</div>';
    }
    result += '</div></div>';
    return result;
}

function renderWuxing(html) {
    const items = html.match(/([金木水火土])\s*[:：]?\s*(\d+)/g);
    if (!items) return simpleRender(html);
    let result = '<div class="wuxing-stats">';
    const colors = {金:'#F5D76E',木:'#4CAF50',水:'#2196F3',火:'#F44336',土:'#FF9800'};
    for (const item of items) {
        const m = item.match(/([金木水火土])[^0-9]*(\d+)/);
        if (m) {
            result += `<div class="wuxing-item" style="background:${colors[m[1]]}20;color:${colors[m[1]]}">${m[1]} ${m[2]}</div>`;
        }
    }
    result += '</div>';
    return result;
}

function simpleRender(text) {
    // marked.js Markdown 渲染 + highlight.js 代码高亮
    if (typeof marked !== 'undefined') {
        try {
            if (typeof hljs !== 'undefined') {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
            } else {
                marked.setOptions({ breaks: true, gfm: true });
            }
            return marked.parse(text);
        } catch(e) {}
    }
    // fallback: 基础转义
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

        if (allChats[currentChatId] && allChats[currentChatId].messages.length > 0) {
            var lastMsg = allChats[currentChatId].messages[allChats[currentChatId].messages.length - 1];
            panCardHtml = lastMsg._rendered || '';
        }
        var newContent = renderContent(fullText, window._lastPanData);
        if (panCardHtml && fullText && !fullText.startsWith('#ERROR')) {
            bubble.innerHTML = panCardHtml + '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' + newContent + '</div>';
        } else {
            bubble.innerHTML = newContent || panCardHtml;
        }
    }
    finalizeStreaming(aiEl, fullText);
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
}

// ===== 智能合盘：场景识别自动追加引擎 =====
function detectAutoCombo(text, existing) {
    var combos = {
        // 感情婚姻 → 八字+紫微+七政四余 三家交叉验证
        '感情': ['bazi', 'ziwei', 'qizheng'],
        '婚姻': ['bazi', 'ziwei', 'qizheng'],
        '姻缘': ['bazi', 'ziwei'],
        '桃花': ['bazi', 'ziwei'],
        
        // 事业财运 → 八字+紫微+奇门 三家交叉
        '事业': ['bazi', 'ziwei', 'qimen'],
        '财运': ['bazi', 'ziwei'],
        '财富': ['bazi', 'ziwei'],
        '工作': ['bazi', 'ziwei'],
        '升职': ['bazi', 'ziwei'],
        
        // 健康 → 八字+紫微
        '健康': ['bazi', 'ziwei'],
        '身体': ['bazi', 'ziwei'],
        '疾病': ['bazi', 'ziwei'],
        
        // 重大决策 → 八字+六壬+奇门 
        '决策': ['bazi', 'liuren', 'qimen'],
        '投资': ['bazi', 'liuren', 'qimen'],
        '买房': ['bazi', 'liuren'],
        '出行': ['liuren', 'qimen'],
        
        // 学业 → 八字+紫微
        '学业': ['bazi', 'ziwei'],
        '考试': ['bazi', 'ziwei'],
        '文昌': ['bazi', 'ziwei'],
        
        // 风水 → 八宅+玄空
        '风水': ['bazhai', 'fengshui'],
        '布局': ['bazhai', 'fengshui'],
        
        // 综合命理深度 → 八字+紫微+七政四余+六壬 (全维度)
        '综合': ['bazi', 'ziwei', 'qizheng', 'liuren'],
        '全面': ['bazi', 'ziwei', 'qizheng', 'liuren'],
        '全方位': ['bazi', 'ziwei', 'qizheng', 'liuren'],

        // 工具类
        '经纬度': ['location'],
        '地理位置': ['location'],
        '坐标': ['location'],
        '时间转换': ['timeconvert'],
        '真太阳时': ['timeconvert'],
        '农历转换': ['timeconvert'],
        '公历转农历': ['timeconvert'],
        '农历转公历': ['timeconvert'],
        '校正': ['timeconvert'],
    };

    var added = [];
    for (var keyword in combos) {
        if (text.indexOf(keyword) !== -1) {
            var engines = combos[keyword];
            for (var i = 0; i < engines.length; i++) {
                if (existing.indexOf(engines[i]) === -1 && added.indexOf(engines[i]) === -1) {
                    added.push(engines[i]);
                }
            }
        }
    }

    // 如果用户明确指定了引擎（如"八字的感情"），只追加未指定的
    if (existing.length >= 2) return added;  // 用户已指定2+引擎，不自动追加
    
    // 如果只匹配了八字，但提到了感情/事业等，自动追加
    if (existing.length === 1 && existing[0] === 'bazi' && added.length > 0) {
        return added;
    }

    // 如果什么都没匹配但提到了感情/事业等关键词
    if (existing.length === 0 && added.length > 0) {
        return added;
    }

    return [];
}

// ===== 智能识别排盘请求 =====
function detectPanRequest(text) {
    const patterns = [
        { type: 'bazi', re: /(?:排|算|看|查|批)?(?:八字|四柱|命盘|生辰)/ },
        { type: 'liuyao', re: /(?:排|算|起)?(?:六爻|卦)/ },
        { type: 'liuren', re: /(?:排|算|看)?(?:六壬|大六壬|壬盘)/ },
        { type: 'qimen', re: /(?:排|算|看)?(?:奇门|遁甲|奇门遁甲)/ },
        { type: 'qizheng', re: /(?:排|算|看)?(?:七政|七政四余|星盘)/ },
        { type: 'ziwei', re: /(?:排|算|看)?(?:紫微|紫微斗数|斗数|十二宫)/ },
        { type: 'qizheng', re: /(?:排|算|看)?(?:七政|七政四余|星盘)/ },
        { type: 'bazhai', re: /(?:排|算|看)?(?:八宅|飞星|紫白)/ },
        { type: 'yunshi', re: /(?:今日|今天|每日|本周)?(?:运势|运程|运气)/ },
        { type: 'huangli', re: /(?:看|查|翻|打开)?(?:黄历|万年历|老黄历)/ },
        { type: 'haoma', re: /(?:测|算|看)?(?:手机号|号码|车牌号).*(?:吉凶|好不好|怎么样)/ },
        { type: 'hehun', re: /(?:算|测|看)?(?:合婚|婚配|八字合婚|配对|姻缘)/ },
        { type: 'fengshui', re: /(?:看|算|排)?(?:风水|玄空|飞星|八宅)/ },
        { type: 'xingming', re: /(?:测|算|看|改)?(?:名字|姓名|起名)/ },
        { type: 'stock', re: /(?:看|查)?(?:大盘|指数|股票|行情|股市)/ },
        { type: 'security', re: /(?:搜|查|找|看)?(?:漏洞|CVE|安全漏洞)/ },
        { type: 'reading', re: /(?:解读|分析)?(?:命盘|八字命盘|紫微命盘)/ },
    ];

    // 收集所有匹配的引擎（支持用户同时问多个术数）
    var matches = [];
    for (const p of patterns) {
        if (p.re.test(text)) {
            matches.push(p.type);
        }
    }
    if (matches.length === 0) return null;

    // ===== 智能合盘：根据用户意图自动追加配套引擎 =====
    var autoCombo = detectAutoCombo(text, matches);
    if (autoCombo.length > 0) {
        for (var i = 0; i < autoCombo.length; i++) {
            if (matches.indexOf(autoCombo[i]) === -1) matches.push(autoCombo[i]);
        }
    }

    // 提取公共参数（智能日期解析，支持多种自由格式）
    var date = '2000-01-01';
    // 格式1: 1996-08-15, 1996/08/15
    var dm1 = text.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    // 格式2: 1996年8月15日
    var dm2 = text.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    // 格式3: 1996.08.15
    var dm3 = text.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
    // 格式4: 1996 08 15 (纯空格)
    var dm4 = text.match(/(\d{4})\s+(\d{1,2})\s+(\d{1,2})(?!\d)/);
    // 格式5: 08-15-1996 或 08/15/1996 (美式)
    var dm5 = text.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    // 格式6: 纯年份 (如 "看风水 2026")
    var dm6 = text.match(/(?:年份|年\s*)?\b(\d{4})\b/);

    var dm = dm1 || dm2 || dm3 || dm4 || dm5 || dm6;
    if (dm) {
        if (dm5) {
            // 美式格式 → 年月日
            date = dm[3] + '-' + dm[1].padStart(2,'0') + '-' + dm[2].padStart(2,'0');
        } else if (dm6 && dm6[1] && dm6[1].length === 4 && !dm1 && !dm2 && !dm3 && !dm4) {
            // 纯年份 → 只传年份（风水等引擎可以直接用）
            date = dm6[1];
        } else {
            date = dm[1] + '-' + dm[2].padStart(2,'0') + '-' + dm[3].padStart(2,'0');
        }
    }

    var time = '12:00';
    // 格式1: 12:00, 12：00
    var tm1 = text.match(/(\d{1,2})[：:](\d{2})/);
    // 格式2: 下午3点, 早上8点半, 中午12点, 晚上9点30分
    var tm2 = text.match(/(?:早上|上午|中午|下午|晚上|早晨|傍晚)?(\d{1,2})\s*[点时](?:半|(\d{1,2})\s*分?)?/);
    if (tm1) {
        time = tm1[1].padStart(2,'0') + ':' + tm1[2];
    } else if (tm2) {
        var h = parseInt(tm2[1]);
        if (/下午|晚上|傍晚/.test(text)) h += 12;
        if (h >= 24) h -= 12;
        // 处理"半" — 正则中半没有捕获组，所以 tm2[2] 为 undefined
        var m = text.indexOf('半') !== -1 ? '30' : (tm2[2] || '00');
        time = String(h).padStart(2,'0') + ':' + m.padStart(2,'0');
    }

    var gender = /(?:女|她|娘|妹|姐|妇|母|妻)/.test(text) ? '女' : '男';
    const locMatch = text.match(/(?:在|地点|出生[于在])([\u4e00-\u9fa5]{2,6})/);
    const location = locMatch ? locMatch[1] : '北京';

    // 单引擎：返回原格式
    if (matches.length === 1) {
        return { type: matches[0], date, time, gender, location };
    }
    // 多引擎：返回数组
    return { types: matches, date, time, gender, location, multi: true };
}

// ===== 调用排盘 API =====
async function fetchPan(info) {
    // 多引擎并行请求
    const engines = info.types || (info.type ? [info.type] : []);
    if (engines.length === 0) return null;

    try {
        const promises = engines.map(async function(engine) {
            const params = new URLSearchParams({ engine: engine, date: info.date, time: info.time, gender: info.gender });
            if (info.location) params.set('location', info.location);
            const r = await fetch(`${API_BASE}/api/pan?${params}`);
            const d = await r.json();
            return { engine: engine, result: d.result || d };
        });
        const results = await Promise.all(promises);
        // 单引擎：返回原格式
        if (results.length === 1) return results[0].result;
        // 多引擎：返回键值对
        var multiResult = { _multi: true };
        for (var i = 0; i < results.length; i++) {
            multiResult[results[i].engine] = results[i].result;
        }
        return multiResult;
    } catch(e) {
        console.error('Pan API error:', e);
        return null;
    }
}

// ===== 八字 DSML 构建 =====
function buildBaziDSML(info, pan) {
    var dsml = '<命盘 type="bazi">\n';
    dsml += '  <基本信息>八字排盘 | ' + info.date + ' ' + info.time + ' | ' + (info.gender||'') + '</基本信息>\n';
    
    // 四柱
    var p = pan.pillars || {};
    dsml += '  <四柱>';
    for (var k in {年柱:1,月柱:1,日柱:1,时柱:1}) {
        if (p[k]) dsml += '<' + k + ' 干支="' + p[k].干支 + '" 天干="' + p[k].天干 + '" 地支="' + p[k].地支 + '"/>';
    }
    dsml += '</四柱>\n';
    
    // 日主 + 格局
    dsml += '  <日主>' + (pan.ri_gan||'') + '</日主>\n';
    if (pan.ge_ju) dsml += '  <格局>' + pan.ge_ju.join('、') + '</格局>\n';
    
    // 十神
    if (pan.shi_shen) {
        dsml += '  <十神>';
        for (var sk in pan.shi_shen) {
            var sv = pan.shi_shen[sk];
            if (Array.isArray(sv)) sv = sv.join('、');
            dsml += '<' + sk + '>' + sv + '</' + sk + '>';
        }
        dsml += '</十神>\n';
    }
    
    // 五行
    var wx = pan.wu_xing_counts || {};
    dsml += '  <五行 金="' + (wx.金||0) + '" 木="' + (wx.木||0) + '" 水="' + (wx.水||0) + '" 火="' + (wx.火||0) + '" 土="' + (wx.土||0) + '"/>\n';
    
    // 大运
    var dy = pan.da_yun || [];
    dsml += '  <大运>';
    for (var di = 0; di < dy.length; di++) {
        var d = dy[di];
        if (d.干支) dsml += '<运 干支="' + d.干支 + '" 年龄="' + d.开始年龄 + '-' + d.结束年龄 + '" 年份="' + d.开始年 + '-' + d.结束年 + '"/>';
    }
    dsml += '</大运>\n';
    
    // 流年
    var ly = pan.yearly || [];
    dsml += '  <流年>';
    for (var yi = 0; yi < ly.length; yi++) {
        var y = ly[yi];
        dsml += '<年 年份="' + y.年份 + '" 干支="' + y.干支 + '" 大运="' + (y.大运||'') + '"/>';
    }
    dsml += '</流年>\n';
    
    // 神煞
    if (pan.shen_sha && pan.shen_sha.日主神煞) {
        dsml += '  <神煞>';
        for (var si = 0; si < pan.shen_sha.日主神煞.length; si++) {
            var ss = pan.shen_sha.日主神煞[si];
            dsml += '<煞 名="' + ss.name + '">' + (Array.isArray(ss.value)?ss.value.join(','):ss.value) + '</煞>';
        }
        dsml += '</神煞>\n';
    }
    
    dsml += '</命盘>';
    return dsml;
}

function buildDSML(info, pan) {
    // 八字命理
    if (info.type === 'bazi' && pan.pillars) {
        return buildBaziDSML(info, pan);
    }
    // 紫微斗数
    if (info.type === 'ziwei' && pan.palaces) {
        return buildZiweiDSML(info, pan);
    }
    // 大六壬
    if (info.type === 'liuren' && pan.san_chuan) {
        return buildLiurenDSML(info, pan);
    }
    // 奇门遁甲
    if (info.type === 'qimen' && pan.gong_wei) {
        return buildQimenDSML(info, pan);
    }
    // 六爻
    if (info.type === 'liuyao' && pan.ben_gua) {
        return buildLiuyaoDSML(info, pan);
    }

    let dsml = '<命盘>\n';
    dsml += `  <基本信息>${info.type}排盘 | ${info.date} ${info.time} | ${info.gender} | ${info.location}</基本信息>\n`;

    // 玄空飞星
    if (info.type === 'fengshui' && pan.layout) {
        return buildFengshuiDSML(info, pan);
    }
    // 命盘解读
    if (info.type === 'reading') {
        return buildReadingDSML(info, pan);
    }
    // 安全工具
    if (info.type === 'security') {
        return buildSecurityDSML(info, pan);
    }
    // 股票（前端直渲）
    if (info.type === 'stock') {
        return dsml;
    }

    // 八宅飞星
    if (info.type === 'bazhai' && (pan.bazhai || pan.命卦)) {
        return buildBazhaiDSML(info, pan);
    }
    // 黄历
    if (info.type === 'huangli' && pan.lunar) {
        return buildHuangliDSML(info, pan);
    }
    // 姓名学
    if (info.type === 'xingming' && pan.success) {
        return buildXingmingDSML(info, pan);
    }
    // 号码吉凶
    if (info.type === 'haoma' && pan.号码) {
        return buildHaomaDSML(info, pan);
    }
    // 合婚
    if (info.type === 'hehun' && (pan.男方 || pan.合婚)) {
        return buildHehunDSML(info, pan);
    }
    // 每日运势
    if (info.type === 'yunshi' && pan.综合运势) {
        return buildYunshiDSML(info, pan);
    }
    // 七政四余
    if (info.type === 'qizheng' && pan.star_positions) {
        return buildQizhengDSML(info, pan);
    }
    // 地理位置查询
    if (info.type === 'location' && pan.results) {
        return buildLocationDSML(info, pan);
    }
    // 时间转换
    if (info.type === 'timeconvert' && (pan.solar || pan.lunar || pan.corrected)) {
        return buildTimeConvertDSML(info, pan);
    }

    if (pan.pillars) {
        dsml += '  <四柱>\n';
        for (const [key, p] of Object.entries(pan.pillars)) {
            const kw = pan.xun_kong?.[key] || '';
            const ny = pan.na_yin?.[key.replace('柱','')] || '';
            const cgList = (pan.cang_gan?.[key.replace('柱','支')] || []).join(' ');
            const ssList = pan.shi_shen?.[key.replace('柱','干')] || [];
            const ssAll = Array.isArray(ssList) ? ssList.join(' ') : ssList;
            dsml += `    <${key}>`;
            if (kw) dsml += `<空亡>${kw}</空亡>`;
            if (ny) dsml += `<纳音>${ny}</纳音>`;
            dsml += `<天干>${p['天干']||p['干支']?.[0]||''}</天干>`;
            dsml += `<地支>${p['地支']||p['干支']?.[1]||''}</地支>`;
            if (cgList) dsml += `<藏干>${cgList}</藏干>`;
            if (ssAll) dsml += `<十神>${ssAll}</十神>`;
            dsml += `</${key}>\n`;
        }
        dsml += '  </四柱>\n';
    }

    if (pan.na_yin) {
        dsml += '  <纳音>' + Object.values(pan.na_yin).join(' ') + '</纳音>\n';
    }
    if (pan.ge_ju && pan.ge_ju.length) {
        dsml += '  <格局>' + pan.ge_ju.join('，') + '</格局>\n';
    }
    if (pan.wu_xing_counts) {
        const wc = pan.wu_xing_counts;
        dsml += '  <五行统计>' + Object.entries(wc).map(([k,v])=>`${k}:${v}`).join(' ') + '</五行统计>\n';
    }
    if (pan.da_yun) {
        dsml += '  <大运>\n';
        for (const dy of pan.da_yun.slice(0, 12)) {
            const wuXing = dy['五行'] || '';
            const shiShen = dy['十神'] || '';
            dsml += `    <大运干支><天干>${dy['干支']?.[0]||dy['天干']||''}</天干><地支>${dy['干支']?.[1]||dy['地支']||''}</地支><起运年龄>${dy['开始年龄']||dy['开始年年龄']||0}岁</起运年龄>`;
            if (wuXing) dsml += `<五行>${wuXing}</五行>`;
            if (shiShen) dsml += `<十神>${shiShen}</十神>`;
            dsml += `</大运干支>\n`;
        }
        dsml += '  </大运>\n';
    }
    if (pan.liu_nian) {
        dsml += '  <流年>\n';
        for (const ln of pan.liu_nian.slice(0, 10)) {
            const gan = ln['干支']?.[0] || ln['天干'] || '';
            const zhi = ln['干支']?.[1] || ln['地支'] || '';
            const yearNum = ln['年份'] || '';
            const wuXing = ln['五行'] || '';
            const relDayun = ln['与日主关系'] || ln['十神'] || '';
            const relRiyuan = ln['日主十神'] || '';
            dsml += `    <流年干支><天干>${gan}</天干><地支>${zhi}</地支>`;
            if (yearNum) dsml += `<年份>${yearNum}</年份>`;
            if (wuXing) dsml += `<五行>${wuXing}</五行>`;
            if (relDayun) dsml += `<关系>${relDayun}</关系>`;
            if (relRiyuan) dsml += `<日主十神>${relRiyuan}</日主十神>`;
            dsml += `</流年干支>\n`;
        }
        dsml += '  </流年>\n';
    }
    if (pan.shen_sha) {
        dsml += '  <神煞>';
        const ss = pan.shen_sha;
        if (ss['日主神煞']) dsml += ss['日主神煞'].map(x=>x.name).join(' ');
        if (ss['四柱神煞']) {
            for (const [p, list] of Object.entries(ss['四柱神煞'])) {
                dsml += ' ' + list.map(x=>x.name).join(' ');
            }
        }
        dsml += '</神煞>\n';
    }
    if (pan.ming_gong) dsml += `  <命宫>${pan.ming_gong['干支']||''}</命宫>\n`;
    if (pan.shen_gong) dsml += `  <身宫>${pan.shen_gong['干支']||''}</身宫>\n`;
    dsml += '</命盘>';
    return dsml;
}

// ===== 紫微斗数 DSML =====
function buildZiweiDSML(info, pan) {
    let dsml = `<命盘 type="ziwei">\n`;
    dsml += `  <基本信息>紫微斗数排盘 | ${info.date} ${info.time} | ${info.gender} | ${info.location}</基本信息>\n`;
    dsml += '  <紫微斗数>\n';
    const lifePalace = pan.lifePalace || pan.palaces?.find(p => p.isLifePalace) || {};
    dsml += `    <命宫干支>${lifePalace.stem||''}${lifePalace.branch||''}</命宫干支>\n`;
    dsml += `    <五行局>${pan.fiveElementsClass||''}</五行局>\n`;
    if (pan.palaces) {
        dsml += '    <十二宫>\n';
        for (const palace of pan.palaces) {
            const majStars = (palace.majorStars || []).map(s => s.brightness ? `${s.name}(${s.brightness})` : s.name).join(' ');
            const minStars = (palace.minorStars || []).concat(palace.adjectiveStars || []).map(s => s.name).join(' ');
            dsml += `      <宫 name="${palace.name||''}" 干支="${palace.stem||''}${palace.branch||''}" 主星="${escapeAttr(majStars)}" 辅星="${escapeAttr(minStars)}" 大限="${palace.decadalRange||''}" 命宫="${palace.isLifePalace?'true':'false'}"/>\n`;
        }
        dsml += '    </十二宫>\n';
    }
    dsml += '  </紫微斗数>\n';
    dsml += '</命盘>';
    return dsml;
}

// ===== XML 属性转义 =====
function escapeAttr(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 安全工具 DSML =====
function buildSecurityDSML(info, pan) {
    var dsml = '<命盘 type="security">\n';
    if (pan.url) dsml += '  <URL>' + pan.url + '</URL>\n';
    if (pan.target) dsml += '  <目标>' + pan.target + '</目标>\n';
    if (pan.ports) {
        dsml += '  <端口扫描>';
        for (var i=0; i<pan.ports.length; i++) {
            var p = pan.ports[i];
            dsml += '<端口 号=' + p.port + ' 服务="' + (p.service||'') + '" 状态="' + (p.status||'') + '"/>';
        }
        dsml += '</端口扫描>\n';
    }
    if (pan.headers) {
        dsml += '  <HTTP头>';
        for (var k in pan.headers) { dsml += '<头 名="' + k + '">' + (pan.headers[k]||'') + '</头>'; }
        dsml += '</HTTP头>\n';
    }
    if (pan.missing_headers) dsml += '  <缺失安全头>' + pan.missing_headers.join('、') + '</缺失安全头>\n';
    if (pan.security_score !== undefined) dsml += '  <安全评分>' + pan.security_score + '/' + (pan.security_max||10) + '</安全评分>\n';
    if (pan.domain) dsml += '  <域名>' + pan.domain + '</域名>\n';
    if (pan.nameservers) dsml += '  <DNS>' + pan.nameservers.join('、') + '</DNS>\n';
    if (pan.registered) dsml += '  <注册日期>' + pan.registered + '</注册日期>\n';
    if (pan.status) dsml += '  <状态>' + JSON.stringify(pan.status) + '</状态>\n';
    if (pan.cves) {
        dsml += '  <CVE漏洞>';
        for (var j=0; j<Math.min(pan.cves.length,10); j++) {
            var c = pan.cves[j];
            dsml += '<漏洞 ID="' + (c.id||'') + '" 评分="' + (c.score||'') + '">' + (c.description||'') + '</漏洞>';
        }
        dsml += '</CVE漏洞>\n';
    }
    if (pan.error) dsml += '  <错误>' + pan.error + '</错误>\n';
    dsml += '</命盘>';
    return dsml;
}

// ===== 时间转换 DSML =====
function buildTimeConvertDSML(info, pan) {
    var dsml = '<命盘 type="timeconvert">\n';
    // 公历→农历
    if (pan.solar) {
        dsml += '  <公历转农历>\n';
        dsml += '    <公历>' + pan.solar + '</公历>\n';
        dsml += '    <农历>' + pan.lunar + '</农历>\n';
        if (pan.year_ganzhi) dsml += '    <干支>年柱' + pan.year_ganzhi + ' 月柱' + pan.month_ganzhi + ' 日柱' + pan.day_ganzhi + '</干支>\n';
        if (pan.shengxiao) dsml += '    <生肖>' + pan.shengxiao + '</生肖>\n';
        if (pan.festivals && pan.festivals.length > 0) dsml += '    <节日>' + pan.festivals.join('、') + '</节日>\n';
        dsml += '  </公历转农历>\n';
    }
    // 真太阳时校正
    if (pan.corrected) {
        dsml += '  <真太阳时校正>\n';
        dsml += '    <城市>' + escapeXml(pan.city) + '</城市>\n';
        dsml += '    <经纬度>' + pan.lat + ', ' + pan.lng + '</经纬度>\n';
        dsml += '    <北京时间>' + pan.original + '</北京时间>\n';
        dsml += '    <真太阳时>' + pan.corrected + '</真太阳时>\n';
        dsml += '    <时差 描述="' + pan.offset_desc + '">' + pan.offset_minutes + '分钟</时差>\n';
        dsml += '    <校正后时辰>时柱需用真太阳时 ' + pan.corrected_hour + ':' + (pan.corrected_minute < 10 ? '0' : '') + pan.corrected_minute + ' 重新排盘</校正后时辰>\n';
        dsml += '  </真太阳时校正>\n';
    }
    // 农历→公历
    if (pan.solar && !pan.lunar) {
        dsml += '  <农历转公历>\n';
        dsml += '    <农历>' + pan.lunar_chinese + '</农历>\n';
        dsml += '    <公历>' + pan.solar + '</公历>\n';
        dsml += '  </农历转公历>\n';
    }
    if (pan.error) dsml += '  <错误>' + pan.error + '</错误>\n';
    dsml += '</命盘>';
    return dsml;
}

        '| 年龄段 | 大运干支 | 十神 | 运势特点 | 关键提醒 |',
        '|--------|----------|------|----------|----------|',
        '至少列出5步大运，标注当前所处大运。结合十神生克关系分析每步大运的吉凶。',
        '',
        '### 🎯 实用建议',
        '给出2-3条具体可行的建议（开运方位、幸运色、行业选择、人际策略等）',
        '',
        '---',
        '',
        '## ⚠️ 输出规则',
        '1. 必须用emoji作为分段标题，各段落之间空一行',
        '2. 所有排盘数据必须来自用户提供的DSML，不得凭空编造',
        '3. 用「命主」「此命」「此盘」等客观称呼，不要用「你」',
        '4. 分析要具体，避免泛泛而谈——每个结论都要引用DSML中的具体数据作为依据',
        '5. 五行分析要指出具体生克关系（如「木土交战」「水火既济」「金水相生」）',
        '6. 吉凶判断要明确，不要模棱两可，但要给出化解思路',
        '7. 不要输出DSML标签本身，只输出自然语言分析',
        '8. 回复结束前加一句「🎋 如需详细分析某一方面，请告诉我。」',
        '',
        '### 🧭 术数专精提示',
        '| 术数 | 核心元素 | 适用场景 |',
        '|------|----------|----------|',
        '| 八字命理 | 四柱、十神、五行、大运、流年、神煞 | 一生格局层次、事业财运、婚姻子女 |',
        '| 紫微斗数 | 十二宫、星曜、四化、大限 | 各领域吉凶详批、流年精准推算 |',
        '| 大六壬 | 天地盘、四课、三传、十二天将 | 具体事项吉凶发展（婚恋、求职、投资） |',
        '| 奇门遁甲 | 九宫、八门、九星、八神、天盘地盘 | 占卜+择吉时吉方，趋吉避凶 |',
        '| 六爻 | 本卦、变卦、六亲、世应、动爻 | 一事一占，快速断事 |',
        '| 七政四余 | 七曜、四余、十二宫、二十八宿 | 天星推命，格局高下、限运吉凶 |',
        '| 玄空飞星 | 九宫飞星、山向二星、运星、八宅 | 阳宅风水吉凶、布局化解 |',
        '| 姓名学 | 五格数理、三才配置、字义五行 | 名字吉凶、五行补益 |'
    ].join('\n');

    const body = JSON.stringify({
        model: 'openclaw',
        messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userMessage }
        ],
        stream: true,
        max_tokens: 50000
    });

    // AbortController 支持取消请求
    var abortCtrl = new AbortController();
    window._currentAbort = abortCtrl;

    var retries = 2;
    var resp = null;
    var lastErr = null;
    for (var ri = 0; ri <= retries; ri++) {
        try {
            resp = await fetch(GATEWAY_URL, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + GATEWAY_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: body,
                signal: abortCtrl.signal
            });
            if (resp.ok) break;
            lastErr = new Error('Gateway ' + resp.status);
        } catch(e) {
            lastErr = e;
            if (e.name === 'AbortError') throw e;
            if (ri < retries) { showToast('连接失败，正在重试...(' + (ri+2) + '/' + (retries+1) + ')','warning'); await sleep(1500); }
        }
    }
    window._currentAbort = null;

    // ===== 六层降级链 =====
    // 第①层: 直连Gateway（电脑Web端，SSE流式）— 已尝试，resp为结果
    // 第②层: /api/gateway-proxy 后端代理（手机浏览器/APK，SSE流式）
    if (!resp || !resp.ok) {
        showToast('直连失败，尝试代理通道...', 'info');
        try {
            resp = await fetch('/api/gateway-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMessage, pan_engine: (window._lastPanData ? 'bazi' : ''), pan_result: window._lastPanData || {} }),
                signal: abortCtrl.signal
            });
        } catch(pe) {
            if (pe.name === 'AbortError') throw pe;
        }
    }

    // 第③层: EasyClaw Agent 远程Gateway（APK有网，电脑开机）
    if (!resp || !resp.ok) {
        showToast('代理失败，尝试EasyClaw远程通道...', 'info');
        try {
            var ecResp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: userMessage,
                    use_fc: false,
                    session_id: 'apk-easyclaw-' + Date.now(),
                    pan_engine: window._lastPanData ? 'bazi' : '',
                    pan_result: window._lastPanData || {}
                }),
                signal: abortCtrl.signal
            });
            if (ecResp.ok) {
                var ecJson = await ecResp.json();
                if (ecJson.status === 'ok' && ecJson.reply) {
                    fullText = '🟢 *（通过EasyClaw远程通道回复）*\n\n' + ecJson.reply;
                    var existingCard3 = bubble.querySelector('.bazi-card');
                    if (existingCard3) {
                        bubble.innerHTML = existingCard3.outerHTML + '<div class="stream-text-div" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' + simpleRender(fullText) + '</div>';
                    } else {
                        bubble.innerHTML = renderContent(fullText, window._lastPanData);
                    }
                    return fullText;
                }
            }
        } catch(ece) {
            if (ece.name === 'AbortError') throw ece;
        }
    }

    // 第④层: 硅基流动 FC（APK有网，电脑关机，有网就能用）
    if (!resp || !resp.ok) {
        showToast('EasyClaw不通，尝试硅基流动保底...', 'info');
        try {
            var sfResp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: userMessage,
                    use_fc: true,
                    session_id: 'apk-siliconflow-' + Date.now(),
                    pan_engine: window._lastPanData ? 'bazi' : '',
                    pan_result: window._lastPanData || {}
                }),
                signal: abortCtrl.signal
            });
            if (sfResp.ok) {
                var sfJson = await sfResp.json();
                if (sfJson.status === 'ok' && sfJson.reply) {
                    fullText = '🔶 *（通过硅基流动保底通道回复）*\n\n' + sfJson.reply;
                    var existingCard4 = bubble.querySelector('.bazi-card');
                    if (existingCard4) {
                        bubble.innerHTML = existingCard4.outerHTML + '<div class="stream-text-div" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' + simpleRender(fullText) + '</div>';
                    } else {
                        bubble.innerHTML = renderContent(fullText, window._lastPanData);
                    }
                    return fullText;
                }
            }
        } catch(sfe) {
            if (sfe.name === 'AbortError') throw sfe;
        }
    }

    // 第⑤⑥层留到 sendMessage 的 catch 里处理（离线规则引擎 / 最简JS模板）
    if (!resp || !resp.ok) throw lastErr || new Error('所有在线通道均失败（直连/代理/EasyClaw/硅基流动）');

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed === 'data: [DONE]') continue;
            if (!trimmed.startsWith('data: ')) continue;
            try {
                const json = JSON.parse(trimmed.slice(6));
                const delta = json.choices?.[0]?.delta?.content;
                if (delta) {
                    fullText += delta;
                    // 保留已有排盘卡片（bazi-card 等），在卡片后追加流式文本
                    var existingCard = bubble.querySelector('.bazi-card');
                    if (existingCard) {
                        bubble.innerHTML = existingCard.outerHTML + '<div class="stream-text-div" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' + simpleRender(fullText) + '<span class="stream-cursor"></span></div>';
                    } else {
                        bubble.innerHTML = renderContent(fullText, window._lastPanData) + '<span class="stream-cursor"></span>';
                    }
                    scrollBottom();
                }
            } catch(e) {}
        }
    }
    // 去掉光标，保留已有卡片
    var existingCard = bubble.querySelector('.bazi-card');
    if (existingCard) {
        bubble.innerHTML = existingCard.outerHTML + '<div class="stream-text-div" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' + simpleRender(fullText || '（模型未返回内容）') + '</div>';
    } else {
        bubble.innerHTML = renderContent(fullText || '（模型未返回内容）', window._lastPanData);
    }
    return fullText || '（模型未返回内容）';
}

// ===== 右键/长按菜单 =====
var ctxMenuEl = null;
var ctxTargetMsg = null;

function showContextMenu(e, msgEl) {
    e.preventDefault();
    hideContextMenu();
    ctxTargetMsg = msgEl;

    var menu = document.createElement('div');
    menu.className = 'ctx-menu';
    menu.innerHTML = ''
        + '<div class="ctx-item" onclick="copyMsgFromCtx()">📋 复制</div>'
        + '<div class="ctx-item" onclick="quoteMsgFromCtx()">💬 引用回复</div>'
        + '<div class="ctx-divider"></div>'
        + '<div class="ctx-item danger" onclick="deleteMsgFromCtx()">🗑️ 删除</div>';
    menu.style.left = Math.min(e.clientX, window.innerWidth-150) + 'px';
    menu.style.top = Math.min(e.clientY, window.innerHeight-120) + 'px';
    document.body.appendChild(menu);
    ctxMenuEl = menu;

    // 点击其他地方关闭
    setTimeout(function() {
        document.addEventListener('click', hideContextMenu, {once: true});
        document.addEventListener('touchstart', hideContextMenu, {once: true});
    }, 50);
}

function hideContextMenu() {
    if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; ctxTargetMsg = null; }
}

function copyMsgFromCtx() {
    if (!ctxTargetMsg) return;
    var bubble = ctxTargetMsg.querySelector('.bubble');
    if (bubble) {
        navigator.clipboard.writeText(bubble.innerText||bubble.textContent||'').then(function(){});
    }
    hideContextMenu();
}

function deleteMsgFromCtx() {
    if (!ctxTargetMsg) return;
    ctxTargetMsg.style.transition = 'all 200ms';
    ctxTargetMsg.style.opacity = '0';
    ctxTargetMsg.style.transform = 'scale(0.9)';
    setTimeout(function() { ctxTargetMsg.remove(); }, 200);
    // 从持久化中删除（简化处理：重建时跳过已删除的）
    hideContextMenu();
}

function quoteMsgFromCtx() {
    if (!ctxTargetMsg) return;
    var bubble = ctxTargetMsg.querySelector('.bubble');
    if (!bubble) return;
    var text = (bubble.innerText || bubble.textContent || '').trim();
    // 取前 80 字
    if (text.length > 80) text = text.substring(0, 80) + '...';
    var input = document.getElementById('userInput');
    if (input) {
        input.value = '> ' + text + '\n\n';
        input.focus();
        autoResizeTextarea();
    }
    hideContextMenu();
}

// ===== 分享消息 =====
function shareMsg(btn) {
    var bubble = btn.closest('.msg')?.querySelector('.bubble');
    if (!bubble) return;
    var text = (bubble.innerText || bubble.textContent || '').trim();
    if (navigator.share) {
        navigator.share({ title: '随身大师', text: text }).catch(function(){});
    } else {
        navigator.clipboard.writeText(text).then(function(){
            btn.textContent = '✅';
            setTimeout(function(){ btn.textContent = '🔗'; }, 1500);
        });
    }
}
// ===== 复制消息 =====
function copyMsg(btn) {
    const bubble = btn.closest('.msg')?.querySelector('.bubble');
    if (!bubble) return;
    // 获取文本内容（排除 HTML 标签）
    const text = bubble.innerText || bubble.textContent || '';
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = '📋'; }, 1500);
    }).catch(() => {
        btn.textContent = '❌';
        setTimeout(() => { btn.textContent = '📋'; }, 1500);
    });
}

function renderTianDiPan(tp, tj, dtp, dtj, tjNames) {
    // 12地支位置（钟表盘: 子下 午上）
    var positions = {
        '子': {x:50,y:85}, '丑': {x:25,y:70}, '寅': {x:15,y:50},
        '卯': {x:25,y:30}, '辰': {x:50,y:15}, '巳': {x:75,y:30},
        '午': {x:85,y:50}, '未': {x:75,y:70}, '申': {x:50,y:50},
        '酉': {x:75,y:70}, '戌': {x:50,y:15}, '亥': {x:25,y:30}
    };
    // 修正：按实际天盘位置
    var pos = {
        '巳':{x:15,y:15}, '午':{x:50,y:5}, '未':{x:85,y:15}, '申':{x:95,y:50},
        '酉':{x:85,y:85}, '戌':{x:50,y:95}, '亥':{x:15,y:85}, '子':{x:5,y:50},
        '丑':{x:15,y:15}, '寅':{x:15,y:15}, '卯':{x:15,y:15}, '辰':{x:15,y:15}
    };
    // 地盘12宫位置（从上=巳开始顺时针）
    var palaceOrder = ['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'];
    var angles = [210,180,150,120,90,60,30,0,330,300,270,240]; // 从顶部开始（子=0度在底）
    
    var html = '<div class="lr-circle">';
    html += '<div style="position:relative;width:100%;height:100%">';
    
    for (var i = 0; i < palaceOrder.length; i++) {
        var zhi = palaceOrder[i];
        var angleDeg = angles[i];
        var rad = angleDeg * Math.PI / 180;
        var r = 90;
        var cx = 50 + r * Math.cos(rad);
        var cy = 50 + r * Math.sin(rad);
        
        var isSame = dtp[zhi] === zhi;
        var cls = isSame ? ' lr-slot zhi-same' : ' lr-slot zhi';
        
        html += '<div class="' + cls + '" style="left:' + cx + '%;top:' + cy + '%">';
        html += '<span>' + (dtp[zhi]||zhi) + '</span>';
        if (dtj[zhi]) {
            html += '<div class="lr-slot jiang" style="left:50%;top:65%">' + (tjNames[dtj[zhi]]||dtj[zhi]) + '</div>';
        }
        html += '</div>';
    }

function renderDiPan(dp, shensha) {
    var palaceOrder = ['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'];
    var angles = [210,180,150,120,90,60,30,0,330,300,270,240];
    
    var html = '<div class="lr-circle">';
    html += '<div style="position:relative;width:100%;height:100%">';
    
    for (var i = 0; i < palaceOrder.length; i++) {
        var zhi = palaceOrder[i];
        var angleDeg = angles[i];
        var rad = angleDeg * Math.PI / 180;
        var r = 85;
        var cx = 50 + r * Math.cos(rad);
        var cy = 50 + r * Math.sin(rad);
        
        html += '<div class="lr-slot zhi" style="left:' + cx + '%;top:' + cy + '%">';
        html += '<span>' + zhi + '</span>';
        // 神煞标记
        for (var k in shensha) {
            if (shensha[k] === zhi) {
                html += '<div style="font-size:7px;color:var(--gold);position:absolute;top:70%;left:50%;transform:translateX(-50%);white-space:nowrap">' + k + '</div>';
                break;
            }
        }
        html += '</div>';
    }
    
    html += '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;color:var(--text4)">地盘</div>';
    html += '</div></div>';
    return html;
}

var currentDivineType = 'time'; // time|manual|number

function showDivineOptions() {

}

function hideHehunOverlay() {
    document.getElementById('hehunOverlay').classList.add('hidden');
    window._hehunPending = null;
}

function submitHehun() {
    var maleDate = document.getElementById('hehun-male-date').value.trim();
    var maleTime = document.getElementById('hehun-male-time').value.trim();
    var femaleDate = document.getElementById('hehun-female-date').value.trim();
    var femaleTime = document.getElementById('hehun-female-time').value.trim();

    if (!maleDate || !femaleDate) {
        showToast('请填写双方的出生日期', 'warning');
        return;
    }
    if (!maleTime) maleTime = '12:00';
    if (!femaleTime) femaleTime = '12:00';

    // 隐藏弹窗
    document.getElementById('hehunOverlay').classList.add('hidden');

    // 构建显示消息并添加到对话
    var displayMsg = '💑 八字合婚\n👨 男方: ' + maleDate + ' ' + maleTime + '\n👩 女方: ' + femaleDate + ' ' + femaleTime;
    addMessage('user', displayMsg);
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    // 构建请求参数
    var panInfo = { type: 'hehun', date: maleDate, time: maleTime, gender: '男' };
    panInfo._hehunFemale = { date: femaleDate, time: femaleTime };

    // 发起排盘
    fetchPanAPI(panInfo).then(function(panResult) {
        onPanComplete(panResult);
    }).catch(function(err) {
        showToast('合婚分析失败: ' + err.message, 'error');
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    });
}

// 提取 fetchPan 调用为独立函数
function fetchPanAPI(panInfo) {
    var apiUrl = '/api/pan?engine=' + panInfo.type + '&date=' + encodeURIComponent(panInfo.date) + '&time=' + encodeURIComponent(panInfo.time) + '&gender=' + encodeURIComponent(panInfo.gender);
    // 合婚需要传递双方信息
    if (panInfo._hehunFemale) {
        apiUrl += '&surname=' + encodeURIComponent(panInfo._hehunFemale.date) + '&givenname=' + encodeURIComponent(panInfo._hehunFemale.time);
    }
    return fetch(apiUrl).then(function(r) {
        if (!r.ok) throw new Error('API ' + r.status);
        return r.json();
    }).then(function(data) {
        if (data.result && data.result.error) throw new Error(data.result.error);
        return data.result || data;
    });
}

// 排盘完成回调
function onPanComplete(panResult) {
    if (!panResult) {
        showToast('排盘无结果', 'error');
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        return;
    }
    var aiEl = addMessage('ai', '', true);
    var bubble = aiEl.querySelector('.bubble');
    // 渲染结果
    if (renderHehun) {
        bubble.innerHTML = renderHehun(panResult);
    } else {
        bubble.innerHTML = '<div style="white-space:pre-wrap">' + escapeHtml(JSON.stringify(panResult, null, 2)) + '</div>';
    }
    // 触发 AI 解读
    var dsml = buildDSML({type:'hehun',date:'',time:''}, panResult);
    var aiPrompt = '用户请求八字合婚。\n\n以下是排盘结果（DSML格式）：\n' + dsml + '\n\n请基于以上合婚数据进行专业分析。分析内容包括：双方五行互补、生肖配对、纳音相生、日柱相合、综合评分与婚姻建议。';
    streamChat(aiPrompt, aiEl).then(function() {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    }).catch(function(e) {
        showToast('AI 解读失败: ' + e.message, 'error');
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    });
}

function selectDivineMethod(method) {
    currentDivineType = method;
    var panel = document.getElementById('divinePanel');
    var input = document.getElementById('userInput');
    
    if (method === 'time') {
        hideDivineOptions();
        sendMessage('帮我排六爻（时间起卦）');
    } else if (method === 'manual') {
        panel.innerHTML = buildCoinUI();
        coinResults = [];

function buildCoinUI() {
    return '<div class="coin-area">'
        + '<div class="coin-status" id="coinStatus">摇第 ' + (coinCount+1) + '/6 次</div>'
        + '<button class="coin-btn" onclick="tossCoin()">🪙</button>'
        + '<div class="coin-result" id="coinResult"></div>'
        + '<div class="coin-history" id="coinHistory"></div>'
        + (coinCount >= 6 ? '<div style="margin-top:12px"><button class="quick-btn" onclick="submitCoinResult()" style="font-size:13px;padding:8px 20px">📤 提交排盘</button></div>' : '')
        + '<div class="divine-cancel" onclick="hideDivineOptions()">取消</div>'
        + '</div>';
}

function tossCoin() {
    if (coinCount >= 6) return;
    // 随机模拟三枚铜钱
    var coins = [Math.random()>0.5?3:2, Math.random()>0.5?3:2, Math.random()>0.5?3:2];
    var total = coins[0]+coins[1]+coins[2];
    var face = coins.map(function(c){return c===3?'正面':'反面'}).join(' ');
    
    // 6=老阴 7=少阳 8=少阴 9=老阳
    var result = { value: total, label: total===6?'老阴 ▅▅  ▅▅ X':total===7?'少阳 ▅▅▅▅▅':total===8?'少阴 ▅▅  ▅▅':total===9?'老阳 ▅▅▅▅▅ O':'', cls: total===7||total===9?'yang':total===6?'old-yin':total===8?'yin':total===9?'old-yang':'yin' };
    coinResults.unshift(result);
    coinCount++;
    
    document.getElementById('coinStatus').textContent = '摇第 ' + (coinCount+1) + '/6 次';
    document.getElementById('coinResult').textContent = '三枚: ' + face + ' → ' + total + '点 ' + result.label;
    
    var hist = document.getElementById('coinHistory');
    hist.innerHTML = coinResults.map(function(r,i){
        return '<div class="coin-line ' + r.cls + '" title="第'+(6-i)+'爻:'+r.label+'">' + (6-i) + '</div>';
    }).join('');
    
    if (coinCount >= 6) {
        document.getElementById('coinStatus').textContent = '✅ 六爻已齐';
        // 更新面板
        document.getElementById('divinePanel').innerHTML = buildCoinUI();
    }
}

function submitCoinResult() {
    hideDivineOptions();
    var values = coinResults.map(function(r){return r.value});
    var msg = '帮我排六爻，手动摇卦结果（从初爻到上爻）: ' + values.join(',') + ' (6=老阴7=少阳8=少阴9=老阳）';
    sendMessage(msg);
}

// ===== 股票/大盘渲染 =====
function renderStock(data) {
    var r = data.result || data;
    var html = '<div class="bazi-card">';
    html += '<div class="card-title">📈 大盘指数</div>';
    
    // 尝试结构化数据（指数数组）
    var indices = (r['指数'] || r['数据'] || []);
    if (indices.length > 0) {
        html += '<div style="font-size:12px;overflow-x:auto"><table style="width:100%;border-collapse:collapse">';
        html += '<tr style="font-weight:700;border-bottom:1px solid var(--border)"><td style="padding:4px 8px">名称</td><td style="padding:4px 8px">最新</td><td style="padding:4px 8px">涨跌额</td><td style="padding:4px 8px">涨跌幅</td></tr>';
        for (var i = 0; i < indices.length; i++) {
            var item = indices[i];
            var zdf = item['涨跌幅'];
            // 兼容数字和字符串两种格式（API 返回数字，文本解析返回字符串）
            if (typeof zdf === 'number') {
                var isUp = zdf >= 0;
                zdf = (zdf >= 0 ? '+' : '') + zdf.toFixed(2) + '%';
            } else {
                zdf = zdf || '';
                var isUp = zdf.indexOf('+') >= 0 || zdf.indexOf('红') >= 0;
            }
            var color = isUp ? '#E53935' : '#4CAF50';
            var arrow = isUp ? '▲' : '▼';
            html += '<tr>';
            html += '<td style="padding:4px 8px">' + (item['名称'] || '') + '</td>';
            html += '<td style="padding:4px 8px;font-weight:700">' + (item['最新'] || '') + '</td>';
            html += '<td style="padding:4px 8px;color:' + color + '">' + (item['涨跌额'] || '') + '</td>';
            html += '<td style="padding:4px 8px;color:' + color + '">' + arrow + ' ' + zdf + '</td>';
            html += '</tr>';
        }
        html += '</table></div>';
    } else {
        // 兜底：文本解析
        var stdout = r.stdout || '';
        var content = r.content || r.message || '';
        var text = stdout || content;
        if (text) {
            var lines = text.split('\n').filter(function(l){ return l.trim(); });
            html += '<div style="font-size:12px;overflow-x:auto"><table style="width:100%;border-collapse:collapse">';
            for (var j = 0; j < lines.length; j++) {
                var line = lines[j].trim();
                if (line.indexOf('--') >= 0 || line.indexOf('==') >= 0) continue;
                var cols = line.indexOf('|') >= 0 ? line.split('|').map(function(c){ return c.trim(); }) : line.split(/\s{2,}|\t/);
                cols = cols.filter(function(c){ return c; });
                if (cols.length < 2) {
                    html += '<tr><td colspan="4" style="padding:4px 8px;font-weight:700">' + line + '</td></tr>';
                    continue;
                }
                html += '<tr>';
                for (var k = 0; k < cols.length; k++) {
                    html += '<td style="padding:4px 8px;white-space:nowrap">' + cols[k] + '</td>';
                }
                html += '</tr>';
            }
            html += '</table></div>';
        } else {
            html += simpleRender(JSON.stringify(r, null, 2));
        }
    }
    html += '</div>';
    return html;
}
// ===== 安全漏洞渲染 =====
function renderSecurity(data) {
    var r = data.result || data;
    var html = '<div class="bazi-card">';
    html += '<div class="card-title">🛡️ 安全工具</div>';
    
    // 结构化数据（API 返回）
    if (typeof r === 'object' && !r.stdout && !r.content) {
        html += '<div class="info-card">';
        for (var key in r) {
            var val = r[key];
            if (typeof val === 'object') val = JSON.stringify(val);
            html += '<div class="info-row"><span class="info-label">' + key + '</span><span class="info-value" style="font-size:11px;word-break:break-all">' + String(val) + '</span></div>';
        }
        html += '</div>';
        html += '</div>';
        return html;
    }
    
    var stdout = r.stdout || '';
    var content = r.content || r.message || '';
    var text = stdout || content;
    
    if (text) {
        // 解析 CVE 条目
        var lines = text.split('\n').filter(function(l){ return l.trim(); });
        html += '<div style="max-height:500px;overflow-y:auto">';
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('--') >= 0 || line.indexOf('==') >= 0) continue;
            // 检测 CVE ID
            var cveMatch = line.match(/CVE-\d{4}-\d{4,}/i);
            if (cveMatch) {
                html += '<div style="padding:6px 8px;margin:4px 0;background:var(--surface);border-radius:6px;border:1px solid var(--border)">';
                html += '<span style="font-weight:700;color:var(--danger)">' + cveMatch[0] + '</span>';
                html += '<span style="font-size:11px;margin-left:8px;color:var(--text3)">' + line.replace(cveMatch[0], '') + '</span>';
                html += '</div>';
            } else {
                html += '<div style="font-size:11px;color:var(--text3);padding:3px 8px">' + line + '</div>';
            }
        }
        html += '</div>';
    } else {
        html += simpleRender(JSON.stringify(r, null, 2));
    }
    html += '</div>';
    return html;
}

        var paras = text.split(/\n{2,}/);
