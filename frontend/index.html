// ===== 文件上传处理 =====
function handleFileUpload(event) {
    var file = event.target.files[0];
    if (!file) return;
    
    // 检查文件类型
    if (!file.type.startsWith('image/')) {
        showUploadError('仅支持图片文件（JPG/PNG/WebP）');
        return;
    }
    
    // 检查文件大小（5MB限制）
    if (file.size > 5 * 1024 * 1024) {
        showUploadError('图片大小不能超过 5MB');
        return;
    }
    
    // 显示上传中的消息
    var uploadMsg = { role: 'user', content: '📷 ' + file.name, time: Date.now(), _isUpload: true, _fileName: file.name };
    allChats[currentChatId].messages.push(uploadMsg);
    renderAllMessages();
    scrollToBottom();
    
    // 读取图片为 base64
    var reader = new FileReader();
    reader.onload = function(e) {
        var base64 = e.target.result;
        // 发送给 AI 分析
        var prompt = '请识别并提取这张图片中的文字信息。如果包含出生日期、时间、性别等信息，请以格式化的方式输出。图片内容：' + base64.substring(0, 100) + '...(图片已上传)';
        processImageUpload(file.name, base64);
    };
    reader.onerror = function() {
        showUploadError('图片读取失败，请重试');
    };
    reader.readAsDataURL(file);
    
    // 重置 input 以便可以再次选择同一文件
    event.target.value = '';
}

async function processImageUpload(fileName, base64) {
    var aiEl = createAIBubble();
    var bubble = aiEl.querySelector('.bubble');
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div><div style="font-size:12px;color:var(--text4);text-align:center">正在分析图片...</div>';
    
    // 提取 base64 纯数据
    var base64Data = base64.split(',')[1] || base64;
    
    try {
        // 调用 Gateway Vision API 分析图片
        var response = await fetch(GATEWAY_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + GATEWAY_TOKEN
            },
            body: JSON.stringify({
                model: 'openclaw',
                messages: [{
                    role: 'user',
                    content: [
                        { type: 'text', text: '请识别这张图片中的所有文字内容。如果包含出生日期（年月日）、出生时间、性别、出生地点等信息，请以结构化格式输出：\n日期:YYYY-MM-DD\n时间:HH:MM\n性别:男/女\n地点:城市名\n\n如果图片中没有这些信息，请直接给出图片中的文字内容。' },
                        { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64Data } }
                    ]
                }],
                stream: false,
                temperature: 0.3,
                max_tokens: 2000
            })
        });
        
        if (!response.ok) throw new Error('API 错误: ' + response.status);
        var data = await response.json();
        var result = data.choices?.[0]?.message?.content || '图片分析完成，但未能提取有效信息。';
        
        // 检测是否包含出生信息，自动填入输入框
        var dateMatch = result.match(/日期[:：]\s*(\d{4}[-\/年]\d{1,2}[-\/月]\d{1,2})/);
        var timeMatch = result.match(/时间[:：]\s*(\d{1,2}[:：]\d{2})/);
        var genderMatch = result.match(/性别[:：]\s*(男|女)/);
        
        var suggestText = result;
        if (dateMatch || timeMatch || genderMatch) {
            var d = dateMatch ? dateMatch[1].replace(/[年月]/g, '-').replace(/日$/, '') : '';
            var t = timeMatch ? timeMatch[1] : '';
            var g = genderMatch ? genderMatch[1] : '';
            suggestText = '📋 识别到的信息：\n' + result + '\n\n💡 可以试试：帮我排八字，' + d + (t ? ' ' + t : '') + (g ? ' ' + g : '');
            // 自动填入建议
            var input = document.getElementById('userInput');
            if (input && d) {
                input.value = '帮我排八字，' + d + (t ? ' ' + t : '') + (g ? ' ' + g : '');
                autoResizeTextarea();
                input.focus();
            }
        }
        
        bubble.innerHTML = simpleRender(suggestText);
        var msgObj = { role: 'ai', content: suggestText, time: Date.now() };
        allChats[currentChatId].messages.push(msgObj);
        saveChats();
        renderAllMessages();
        scrollToBottom();
    } catch (e) {
        console.error('图片分析失败:', e);
        bubble.innerHTML = '<div class="error-msg">⚠️ 图片分析失败：' + e.message + '。请尝试用文字描述图片内容。</div>';
        var msgObj = { role: 'ai', content: '图片分析失败', time: Date.now() };
        allChats[currentChatId].messages.push(msgObj);
        saveChats();
    }
}

function showUploadError(msg) {
    var errMsg = { role: 'sys', content: '⚠️ ' + msg, time: Date.now() };
    allChats[currentChatId].messages.push(errMsg);
    renderAllMessages();
    scrollToBottom();
}

// ===== Toast 提示 =====
function showToast(msg, type) {
    type = type || 'info';
    var container = document.getElementById('toast-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
        document.body.appendChild(container);
    }
    var toast = document.createElement('div');
    var colors = { info: '#5B68AA', warning: '#FB8C00', error: '#E53935', success: '#43A047' };
    toast.style.cssText = 'background:' + (colors[type] || colors.info) + ';color:white;padding:10px 20px;border-radius:8px;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.2);pointer-events:auto;animation:fadeIn 0.3s;max-width:360px;word-break:break-word;transition:opacity 0.5s;';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 500); }, 3500);
}

// ===== sleep =====
function sleep(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

// ===== 硬件状态轮询 =====
function fetchHardware() {
    fetch('/api/hardware').then(function(r) { return r.json(); }).then(function(d) {
        var cpu = document.getElementById('hw-cpu');
        var ram = document.getElementById('hw-ram');
        var disk = document.getElementById('hw-disk');
        var uptime = document.getElementById('hw-uptime');
        if (cpu) cpu.textContent = 'CPU ' + (d.cpu.percent||0).toFixed(0) + '%';
        if (ram) ram.textContent = 'RAM ' + (d.memory.percent||0).toFixed(0) + '%';
        if (disk) disk.textContent = '磁盘 ' + (d.disk.percent||0).toFixed(0) + '%';
        if (uptime) {
            var secs = d.uptime_seconds || 0;
            var h = Math.floor(secs / 3600);
            var m = Math.floor((secs % 3600) / 60);
            uptime.textContent = h + 'h ' + m + 'm';
        }
    }).catch(function() {});
}

// ===== 取消当前 AI 请求 =====
function cancelStream() {
    if (window._currentAbort) {
        window._currentAbort.abort();
        window._currentAbort = null;
        showToast('已取消请求', 'warning');
    }
}

// ===== 语音输入 (Web Speech API) =====
var voiceRecognition = null;
function toggleVoice() {
    var btn = document.getElementById('voiceBtn');
    var input = document.getElementById('userInput');

    if (voiceRecognition) {
        voiceRecognition.stop();
        voiceRecognition = null;
        if (btn) btn.textContent = '🎤';
        if (btn) btn.style.background = '';
        showToast('语音输入已停止', 'info');
        return;
    }

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        showToast('浏览器不支持语音输入，请用 Chrome', 'warning');
        return;
    }

    voiceRecognition = new SpeechRecognition();
    voiceRecognition.lang = 'zh-CN';
    voiceRecognition.interimResults = true;
    voiceRecognition.continuous = true;

    if (btn) { btn.textContent = '🔴'; btn.style.background = 'rgba(229,57,53,.15)'; }

    voiceRecognition.onresult = function(event) {
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        if (input) input.value = transcript;
        autoResizeTextarea();
    };

    voiceRecognition.onerror = function(event) {
        showToast('语音错误: ' + event.error, 'error');
        stopVoice();
    };

    voiceRecognition.onend = function() {
        voiceRecognition = null;
        if (btn) { btn.textContent = '🎤'; btn.style.background = ''; }
    };

    voiceRecognition.start();
    showToast('正在聆听...', 'info');
}

function stopVoice() {
    if (voiceRecognition) {
        voiceRecognition.stop();
        voiceRecognition = null;
    }
    var btn = document.getElementById('voiceBtn');
    if (btn) { btn.textContent = '🎤'; btn.style.background = ''; }
}

// ===== TTS 朗读 AI 回复 =====
function speakText(el) {
    var text = el ? (el.textContent || el.innerText || '') : '';
    if (!text || text.length < 5) return;
    if (text.length > 2000) text = text.substring(0, 2000) + '...';

    var ss = window.speechSynthesis;
    if (!ss) { showToast('浏览器不支持 TTS', 'warning'); return; }

    ss.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.0;
    u.pitch = 1.0;

    var voices = ss.getVoices();
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('zh') === 0) { u.voice = voices[i]; break; }
    }

    ss.speak(u);
}
