name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zlib1g-dev libncurses5-dev libtinfo5 autoconf automake libtool
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sifanggeyizhua-apk
          path: bin/*.apk
          retention-days: 90
