name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zlib1g-dev libncurses-dev autoconf automake libtool autoconf-archive pkg-config libffi-dev libssl-dev libltdl-dev
          sudo apt install -y libtinfo6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          pip install pip==23.0.1
          pip install buildozer cython virtualenv

      - name: Copy lunar_python to P4A site-packages
  run: |
    mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/build/python-installs/sifanggeyizhua/armeabi-v7a/lunar_python
    cp -r python_engines/lunar_python/* ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/build/python-installs/sifanggeyizhua/armeabi-v7a/lunar_python/
    mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/build/python-installs/sifanggeyizhua/arm64-v8a/lunar_python
    cp -r python_engines/lunar_python/* ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/build/python-installs/sifanggeyizhua/arm64-v8a/lunar_python/

- name: Build APK
        run: |
          export PYTHONPATH="python_engines:$PYTHONPATH"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sifanggeyizhua-apk
          path: bin/*.apk
          retention-days: 90